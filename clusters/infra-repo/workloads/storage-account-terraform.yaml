# Terraform custom resource reconciled by Tofu Controller. It sources the
# ./infrastructure/storage-account configuration and authenticates to Azure
# via Workload Identity federated to the tofu-controller-storage ServiceAccount
# (see storage-account-serviceaccount.yaml) -- no client secret is stored.
# sourceRef reuses the flux-system GitRepository created by `flux bootstrap`.
apiVersion: infra.contrib.fluxcd.io/v1alpha2
kind: Terraform
metadata:
  name: storage-account
  namespace: flux-system
spec:
  interval: 10m
  path: ./infrastructure/storage-account
  approvePlan: "auto" # auto-approve and apply every generated plan
  destroyResourcesOnDeletion: true # run `terraform destroy` when this resource is deleted
  serviceAccountName: tofu-controller-storage
  # Remote state in a dedicated Azure Storage account (bootstrapped separately,
  # outside this Terraform run) instead of the default in-cluster k8s Secret.
  backendConfig:
    customConfiguration: |
      backend "azurerm" {
        resource_group_name       = "terraform-state"
        storage_account_name      = "tfravistatedev"
        container_name            = "tfstate"
        key                       = "storage-account.tfstate"
        use_aks_workload_identity = true
      }
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  varsFrom:
    - kind: ConfigMap
      name: storage-account-tfvars
  # map(string) vars need a real JSON value; varsFrom ConfigMap values are
  # always strings, so tags is set here instead.
  vars:
    - name: tags
      value:
        environment: dev
        managed_by: tofu-controller
  runnerPodTemplate:
    metadata:
      labels:
        azure.workload.identity/use: "true"
    spec:
      env:
        - name: ARM_CLIENT_ID
          value: "8542c910-9292-4164-97bf-12853a910638"
        - name: ARM_TENANT_ID
          value: "cf36141c-ddd7-45a7-b073-111f66d0b30c"
        - name: ARM_SUBSCRIPTION_ID
          value: "5dea8835-8c38-4f4d-8ac2-7accd278807d"
        - name: ARM_USE_AKS_WORKLOAD_IDENTITY
          value: "true"
  writeOutputsToSecret:
    name: storage-account-outputs
    outputs:
      - storage_account_id
      - storage_account_name
      - primary_blob_endpoint
