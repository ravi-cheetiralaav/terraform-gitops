# Non-sensitive Terraform variable values consumed by the Terraform resource's
# spec.varsFrom. Keep these in sync with infrastructure/storage-account/variables.tf.
apiVersion: v1
kind: ConfigMap
metadata:
  name: storage-account-tfvars
  namespace: flux-system
data:
  resource_group_name: "rg-storage-demo"
  location: "eastus"
  storage_account_name: "ststoragedemo5dea88"
  account_tier: "Standard"
  account_replication_type: "LRS"
  # map(string) vars must be valid HCL/JSON so tofu can parse the -var value
  tags: '{"environment":"dev","managed_by":"tofu-controller"}'
