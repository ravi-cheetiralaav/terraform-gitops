# Flux Kustomization that syncs this repo's clusters/flux-system manifests
# to the cluster automatically, so future edits no longer need manual
# `kubectl apply`.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: terraform-gitops-flux-system
  namespace: flux-system
spec:
  interval: 5m
  path: ./clusters/flux-system
  prune: true
  sourceRef:
    kind: GitRepository
    name: terraform-gitops
    namespace: flux-system
